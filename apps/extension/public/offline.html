<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFF8E1" />
    <title>Нет подключения — Кондитерский Рай</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff8e1;
        background-image: radial-gradient(circle at 15% 0%, rgba(255, 209, 220, 0.55), transparent 45%),
          radial-gradient(circle at 85% 10%, rgba(224, 242, 241, 0.6), transparent 40%);
        font-family: 'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #333333;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 28px;
        border-radius: 32px;
        border: 1px solid #eadcc3;
        background: #fffdf6;
        box-shadow: 0 18px 40px -24px rgba(90, 58, 58, 0.45);
        text-align: center;
      }
      h1 {
        margin: 18px 0 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 26px;
        line-height: 1.2;
        color: #5a3a3a;
      }
      p {
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 1.65;
        color: #5c544e;
      }
      .actions {
        margin-top: 24px;
        display: grid;
        gap: 10px;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 46px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        border: 0;
        background: linear-gradient(135deg, #daa520 0%, #c68e17 100%);
        color: #3e2723;
      }
      a {
        border: 1px solid rgba(198, 142, 23, 0.45);
        color: #5a3a3a;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#FFF8E1" stroke="#DAA520" stroke-width="2" />
        <path d="M19 45h26" stroke="#C68E17" stroke-width="2.4" stroke-linecap="round" />
        <path
          d="M21 45V37.5A3.5 3.5 0 0 1 24.5 34h15A3.5 3.5 0 0 1 43 37.5V45"
          fill="#FFD1DC"
          stroke="#C68E17"
          stroke-width="2"
          stroke-linejoin="round"
        />
        <path
          d="M21 40.6c2.2 1.9 4.4 1.9 6.6 0s4.4-1.9 6.6 0 4.4 1.9 6.6 0"
          fill="none"
          stroke="#FFF8E1"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path d="M32 34V25" stroke="#C68E17" stroke-width="2" stroke-linecap="round" />
        <path
          d="M32 25c2.7 0 3.9-2 3.9-4 0-2-1.5-3.3-3.9-5.8-2.4 2.5-3.9 3.8-3.9 5.8 0 2 1.2 4 3.9 4Z"
          fill="#DC143C"
        />
      </svg>

      <h1>Нет подключения</h1>
      <p>
        Страница не загрузилась из сети, но витрина работает офлайн: откройте приложение — состав
        торта и заказ сохранятся на устройстве.
      </p>

      <div class="actions">
        <button type="button" onclick="location.reload()">Попробовать снова</button>
        <a href="./">На главную</a>
      </div>
    </main>
  </body>
</html>
